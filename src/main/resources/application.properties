spring.application.name=MovimentacaoFinanceira

#Postgres Sisterma Operacional
#spring.datasource.url=jdbc:postgresql://localhost:5432/financeiro
#Postgres Docker
spring.datasource.url=jdbc:postgresql://db:5432/financeiro
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,metrics,swagger-ui
management.endpoint.health.show-details = always

management.metrics.enable.all=true

springdoc.show-actuator=true